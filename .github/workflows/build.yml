name: Build Fragment Cutter installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 customtkinter requests pyinstaller

      - name: Compile check (app.py)
        run: python -m py_compile app.py

      - name: Build FragmentCutter (PyInstaller, onedir)
        run: pyinstaller --onedir --windowed --name FragmentCutter --collect-all customtkinter app.py

      - name: Prepare installer.iss (UTF-8 BOM)
        shell: pwsh
        run: |
          $c = Get-Content -Raw -Encoding UTF8 installer.iss
          [System.IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\installer.iss", $c, (New-Object System.Text.UTF8Encoding $true))

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }

      - name: Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Fragment Cutter v1.0.0
          files: dist/FragmentCutter-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
